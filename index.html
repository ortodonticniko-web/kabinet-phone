<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f6b73"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Расписание"><title>Расписание</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px Inter,system-ui,Arial,sans-serif;background:#f4f7f8;color:#14212b;padding-bottom:84px}
[hidden]{display:none!important}
.top{position:sticky;top:0;background:#f4f7f8;z-index:5;padding:10px 10px 0;border-bottom:1px solid #c3ccd2}
.top h1{margin:0 0 8px;font-size:19px;text-transform:capitalize}
.nav{display:flex;gap:8px;margin-bottom:8px}.nav button,.nav input{height:40px;border:1px solid #c3ccd2;border-radius:10px;background:#fff;font:inherit;padding:0 12px}.nav input{flex:1;min-width:0}
.gh{display:grid;margin-left:-10px;margin-right:-10px}.gh div{text-align:center;padding:4px 0;font-size:11px;color:#4f5b64;border-left:1px solid #dde3e7}.gh b{display:block;font-size:17px;color:#14212b}.gh .td b{color:#0f6b73}.gh small{font-size:10px}
#grid{display:grid;background:#fff}
.tc div{height:36px;font-size:11px;color:#4f5b64;text-align:right;padding:2px 5px 0 0;border-bottom:1px solid #eef1f3}.tc .h{font-weight:700;color:#14212b}
.day{position:relative;border-left:1px solid #dde3e7;cursor:pointer;background-size:100% 36px,100% 216px;background-image:linear-gradient(to bottom,transparent 35px,#e6ebee 35px),linear-gradient(to bottom,transparent 215px,#b9c4cb 215px)}
.day.td{background-color:#eef7f8}
.ap{position:absolute;border-radius:7px;border:1px solid;padding:2px 5px;overflow:hidden;font-size:12px;line-height:1.25;cursor:pointer}
.ap b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ap span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#2f3d47}
.fab{position:fixed;left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 32px));bottom:calc(16px + env(safe-area-inset-bottom));height:50px;border:0;border-radius:14px;background:#0f6b73;color:#fff;font:600 16px inherit;z-index:6}
dialog{width:min(460px,94vw);border:0;border-radius:16px;padding:16px;background:#f4f7f8}
dialog::backdrop{background:#0008}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:#3f4a52;margin-bottom:10px}
input,select{height:46px;border:1px solid #c3ccd2;border-radius:10px;padding:0 12px;font:16px inherit;background:#fff}
.row{display:flex;gap:10px}.row label{flex:1}.ch{display:flex;gap:6px;margin-bottom:10px}
.ch button{flex:1;height:42px;border:1px solid #c3ccd2;border-radius:10px;background:#fff;font:600 14px inherit}.ch .on{background:#0f6b73;color:#fff;border-color:#0f6b73}
.acts{display:flex;gap:8px}.acts button{flex:1;height:48px;border-radius:12px;border:1px solid #c3ccd2;background:#fff;font:600 15px inherit}.acts .ok{background:#0f6b73;color:#fff;border:0}.acts .del{color:#b42318}
#login{padding:60px 24px;text-align:center}#login button{height:50px;padding:0 24px;border:0;border-radius:12px;background:#0f6b73;color:#fff;font:600 16px inherit}
@media(min-width:900px){body{font-size:16px}.ap b{font-size:14px}.ap{font-size:13px}}
</style></head><body>
<div id="login" hidden><h1>Расписание</h1><p id="lmsg">Войдите в свой аккаунт Google</p><button id="in">Войти через Google</button></div>
<div id="app" hidden>
<div class="top"><h1 id="ttl"></h1><div class="nav"><button id="pv">‹</button><input type="date" id="dt"><button id="td">Сегодня</button><button id="nx">›</button></div><div class="gh" id="gh"></div></div>
<div id="grid"></div><button class="fab" id="add">+ Новая запись</button></div>
<dialog id="dlg"><form method="dialog" id="fm" onsubmit="return false">
<div class="row"><label>Дата<input type="date" id="fd" required></label><label style="max-width:120px">Начало<input type="time" id="ft" step="600" required></label></div>
<label>Пациент<input id="fn" required autocomplete="off"></label>
<div style="font-size:12px;font-weight:600;color:#3f4a52;margin-bottom:4px">Длительность, мин</div><div class="ch" id="fc"></div>
<label>Телефон<input id="fp" type="tel"></label><label>Что планируется<input id="fo"></label>
<label>Статус<select id="fs"><option value="plan">Запись</option><option value="came">Пришёл</option><option value="missed">Не пришёл</option><option value="cancelled">Отменён</option></select></label>
<div class="acts"><button type="button" id="cx">Отмена</button><button type="button" class="del" id="dl">Удалить</button><button type="button" class="ok" id="sv">Сохранить</button></div></form></dialog>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,collection,query,where,onSnapshot,doc,setDoc,deleteDoc}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const CFG={apiKey:"AIzaSyBzs-bDLFiQ0F08jMuEbpvjmCiVZZILsbY",authDomain:"kabinet-f4595.firebaseapp.com",projectId:"kabinet-f4595",appId:"1:1039574152732:web:76afea81f78c412498d1d9"};
const OWNER="";
const $=s=>document.querySelector(s),app=initializeApp(CFG),auth=getAuth(app),db=getFirestore(app);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const p2=n=>String(n).padStart(2,'0'),hm=m=>p2(Math.floor(m/60))+':'+p2(m%60),tm=t=>{const m=/^(\d{1,2}):(\d{2})/.exec(t||'');return m?+m[1]*60+ +m[2]:null};
const DOW=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'],RH=36;
const COL=[['#d8eef0','#9ccfd4'],['#fde9d3','#efc08a'],['#e6e3f7','#b9b2e6'],['#e3f2d9','#b3d89a'],['#fbe0e6','#eeaabb'],['#fff3c4','#e6cf73'],['#dbe8fb','#9dbbe8'],['#ece0d6','#cfb49c']];
const mq=matchMedia('(min-width:900px)');
let day=iso(new Date()),unsub=null,items=[],cur=null,dur=30,cols=[],first=true;
const D=s=>new Date(s+'T12:00:00');
function setCols(){if(mq.matches){const d=D(day),w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);cols=[...Array(7)].map((_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return iso(x)})}else cols=[day]}
const shift=n=>{const d=D(day);d.setDate(d.getDate()+n*(mq.matches?7:1));day=iso(d);watch()};
function lanes(l){let cl=[],ce=0;const fl=()=>{const ln=[];cl.forEach(a=>{let i=ln.findIndex(e=>e<=a.s);if(i<0){i=ln.length;ln.push(0)}ln[i]=a.e;a.l=i});cl.forEach(a=>a.n=ln.length)};l.forEach(a=>{if(cl.length&&a.s>=ce){fl();cl=[];ce=0}cl.push(a);ce=Math.max(ce,a.e)});fl()}
function draw(){
  const td=iso(new Date()),n=cols.length;
  $('#ttl').textContent=n>1?D(cols[0]).toLocaleDateString('ru-RU',{day:'numeric',month:'long'})+' — '+D(cols[6]).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'}):D(day).toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
  $('#dt').value=day;
  const tpl='52px repeat('+n+',1fr)';$('#gh').style.gridTemplateColumns=tpl;$('#grid').style.gridTemplateColumns=tpl;
  const by={};cols.forEach(c=>by[c]=[]);
  items.forEach(x=>{const s=tm(x.time);if(s!==null&&by[x.date])by[x.date].push({x,s,e:s+Math.max(10,x.dur||30)})});
  let lo=480,hi=1200;Object.values(by).flat().forEach(a=>{lo=Math.min(lo,Math.floor(a.s/60)*60);hi=Math.max(hi,Math.ceil(a.e/60)*60)});
  const rows=(hi-lo)/10;
  $('#gh').innerHTML='<div style="border:0"></div>'+cols.map(c=>`<div class="${c===td?'td':''}">${DOW[D(c).getDay()]}<b>${+c.slice(8)}</b><small>${by[c].length?by[c].length+' зап.':'—'}</small></div>`).join('');
  let h='<div class="tc">'+[...Array(rows)].map((_,i)=>{const m=lo+i*10;return`<div class="${m%60?'':'h'}">${hm(m)}</div>`}).join('')+'</div>';
  cols.forEach(c=>{const l=by[c].sort((a,b)=>a.s-b.s);lanes(l);
    h+=`<div class="day ${c===td?'td':''}" data-d="${c}" style="height:${rows*RH}px">`+l.map((a,i)=>{const k=a.x.status==='cancelled'?['#eceff1','#cfd6db']:COL[i%COL.length],w=100/a.n,mk=a.x.status==='came'?'✓ ':a.x.status==='missed'?'✕ ':'';
      return`<div class="ap" data-id="${esc(a.x.id)}" style="top:${(a.s-lo)/10*RH}px;height:${Math.max(RH-2,(a.e-a.s)/10*RH-2)}px;left:calc(${a.l*w}% + 1px);width:calc(${w}% - 3px);background:${k[0]};border-color:${k[1]};${a.x.status==='cancelled'?'opacity:.7;':''}"><b>${mk}${esc(a.x.name)}</b><span>${esc(a.x.time)} · ${a.x.dur||30} мин${a.x.note?' · '+esc(a.x.note):''}</span></div>`}).join('')+'</div>'});
  $('#grid').dataset.lo=lo;$('#grid').innerHTML=h;
  if(first&&items.length+1){first=false;const hr=Math.max(lo,Math.min(new Date().getHours()*60-60,hi-120));$('#grid').scrollIntoView();window.scrollTo(0,$('#grid').offsetTop+(hr-lo)/10*RH-120)}
}
function watch(){setCols();unsub&&unsub();unsub=onSnapshot(query(collection(db,'appts'),where('date','>=',cols[0]),where('date','<=',cols[cols.length-1])),s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));draw()},e=>{$('#grid').innerHTML='<div style="padding:20px">Ошибка доступа: '+esc(e.message)+'</div>'});draw()}
function chips(){$('#fc').innerHTML=[15,30,45,60,90,120].map(m=>`<button type="button" data-m="${m}" class="${m===dur?'on':''}">${m}</button>`).join('')}
function openF(x,date,time){cur=x||null;dur=x&&x.dur||30;$('#fd').value=x?x.date:(date||day);$('#ft').value=x?x.time:(time||'');$('#fn').value=x?x.name:'';$('#fp').value=x?x.phone:'';$('#fo').value=x?x.note:'';$('#fs').value=x?x.status:'plan';$('#dl').hidden=!x;chips();$('#dlg').showModal()}
$('#fc').onclick=e=>{const m=e.target.dataset.m;if(m){dur=+m;chips()}};
$('#grid').onclick=e=>{const a=e.target.closest('.ap');if(a){openF(items.find(x=>x.id===a.dataset.id));return}
  const d=e.target.closest('.day');if(d){const y=e.clientY-d.getBoundingClientRect().top,m=+$('#grid').dataset.lo+Math.floor(y/RH)*10;openF(null,d.dataset.d,hm(m))}};
$('#add').onclick=()=>openF();$('#cx').onclick=()=>$('#dlg').close();
$('#sv').onclick=async()=>{if(!$('#fd').value||!$('#ft').value||!$('#fn').value.trim()){alert('Заполните дату, время и пациента');return}
  const id=cur?cur.id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  try{await setDoc(doc(db,'appts',id),{date:$('#fd').value,time:$('#ft').value,name:$('#fn').value.trim(),phone:$('#fp').value.trim(),note:$('#fo').value.trim(),status:$('#fs').value,dur});$('#dlg').close();if(!cols.includes($('#fd').value)){day=$('#fd').value;watch()}}catch(e){alert('Не сохранилось: '+e.message)}};
$('#dl').onclick=async()=>{if(cur&&confirm('Удалить запись?')){try{await deleteDoc(doc(db,'appts',cur.id));$('#dlg').close()}catch(e){alert(e.message)}}};
$('#pv').onclick=()=>shift(-1);$('#nx').onclick=()=>shift(1);$('#td').onclick=()=>{day=iso(new Date());watch()};$('#dt').onchange=e=>{if(e.target.value){day=e.target.value;watch()}};
mq.onchange=()=>{if(!$('#app').hidden)watch()};
$('#in').onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>$('#lmsg').textContent='Не удалось войти: '+e.message);
onAuthStateChanged(auth,u=>{const ok=u&&(!OWNER||u.email.toLowerCase()===OWNER.toLowerCase());$('#app').hidden=!ok;$('#login').hidden=!!ok;if(u&&!ok)$('#lmsg').textContent='Этот аккаунт не имеет доступа';if(ok)watch();else unsub&&unsub()});
</script></body></html>
