<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f6b73"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Расписание"><title>Расписание</title>
<style>
*{box-sizing:border-box}body{margin:0;--bg:#f4f7f8;--cd:#fff;--tx:#14212b;--mu:#4f5b64;--ln:#c3ccd2;--l2:#dde3e7;--l3:#eef1f3;--l4:#e6ebee;--l5:#b9c4cb;--l6:#8fa1ac;--tdb:#eef7f8;--ac:#0f6b73;--on:#fff;--mu2:#3f4a52;--tx2:#2f3d47;--dg:#b42318;font:15px Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:84px}
[hidden]{display:none!important}
.top{position:sticky;top:0;background:var(--bg);z-index:5;padding:10px 10px 0;border-bottom:1px solid var(--ln)}
.top h1{margin:0 0 8px;font-size:19px;text-transform:capitalize}
.nav{display:flex;gap:8px;margin-bottom:8px}.nav button,.nav input{height:40px;border:1px solid var(--ln);border-radius:10px;background:var(--cd);font:inherit;padding:0 12px}.nav input{flex:1;min-width:0}
.gh{display:grid;margin-left:-10px;margin-right:-10px}.gh div{text-align:center;padding:4px 0;font-size:11px;color:var(--mu);border-left:1px solid var(--l2)}.gh b{display:block;font-size:17px;color:var(--tx)}.gh .td b{color:var(--ac)}.gh small{font-size:10px}
#grid{display:grid;background:var(--cd)}
.tc .sb{font-size:9.5px;line-height:1;padding-top:3px;border-bottom-style:dashed}.sl{position:absolute;left:0;right:0;border-top:1px dashed var(--l6);pointer-events:none}.tc div{height:36px;font-size:11px;color:var(--mu);text-align:right;padding:2px 5px 0 0;border-bottom:1px solid var(--l3)}.tc .h{font-weight:700;color:var(--tx)}
.day{position:relative;border-left:1px solid var(--l2);cursor:pointer;background-size:100% 36px,100% 216px;background-image:linear-gradient(to bottom,transparent 35px,var(--l4) 35px),linear-gradient(to bottom,transparent 215px,var(--l5) 215px)}
.day.td{background-color:var(--tdb)}
.ap{color:var(--tx);position:absolute;border-radius:7px;border:1px solid;padding:2px 5px;overflow:hidden;font-size:12px;line-height:1.25;cursor:pointer}
.ap b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ap span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx2)}
.fab{position:fixed;left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 32px));bottom:calc(16px + env(safe-area-inset-bottom));height:50px;border:0;border-radius:14px;background:var(--ac);color:var(--on);font:600 16px inherit;z-index:6}
dialog{color:var(--tx);width:min(460px,94vw);border:0;border-radius:16px;padding:16px;background:var(--bg)}
dialog::backdrop{background:#0008}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--mu2);margin-bottom:10px}
input,select{height:46px;border:1px solid var(--ln);border-radius:10px;padding:0 12px;font:16px inherit;background:var(--cd)}
.row{display:flex;gap:10px}.row label{flex:1}.ch{display:flex;gap:6px;margin-bottom:10px}
.ch button{flex:1;height:42px;border:1px solid var(--ln);border-radius:10px;background:var(--cd);font:600 14px inherit}.ch .on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.st{width:64px;height:46px;border:1px solid var(--ln);border-radius:10px;background:var(--cd);font:600 15px inherit}.acts{display:flex;gap:8px}.acts button{flex:1;height:48px;border-radius:12px;border:1px solid var(--ln);background:var(--cd);font:600 15px inherit}.acts .ok{background:var(--ac);color:var(--on);border:0}.acts .del{color:var(--dg)}
#login{padding:60px 24px;text-align:center}#login button{height:50px;padding:0 24px;border:0;border-radius:12px;background:var(--ac);color:var(--on);font:600 16px inherit}
@media(min-width:900px){body{font-size:16px}.ap b{font-size:14px}.ap{font-size:13px}}
input,select,button{color:var(--tx)}.fab,.ch .on,.acts .ok,#login button,.sw button{color:var(--on)}.sw button{color:inherit;text-shadow:none}.acts .del{color:var(--dg)}.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.hd h1{margin:0!important;min-width:0}.pw{display:flex;gap:8px;flex:none}.rb{width:38px;height:38px;border-radius:50%;border:1px solid var(--ln);background:var(--cd);font-size:19px;line-height:1;padding:0}.ins ol{margin:6px 0 12px;padding-left:20px;line-height:1.5}.ins h3{margin:0 0 4px}.fab{width:auto!important;left:auto!important;right:16px;transform:none!important;padding:0 20px;height:46px!important;border-radius:23px!important;box-shadow:0 4px 14px #0004}body.pc{min-width:900px}.cg{font-size:12px;font-weight:600;color:var(--mu2);margin:4px 0}.sw{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.sw button{height:46px;border:2px solid var(--ln);border-radius:10px;font:600 13px inherit}.sw .on{outline:3px solid var(--ac);outline-offset:1px}.nav .gear{width:40px;padding:0}</style></head><body>
<div id="login" hidden><h1>Расписание</h1><p id="lmsg">Войдите в свой аккаунт Google</p><button id="in">Войти через Google</button></div>
<div id="app" hidden>
<div class="top"><div class="hd"><h1 id="ttl"></h1><span class="pw"><button type="button" id="ia" class="rb" title="Установить на Android">🤖</button><button type="button" id="ii" class="rb" title="Добавить на iPhone">🍎</button></span></div><div class="nav"><button id="pv">‹</button><input type="date" id="dt"><button id="td">Сегодня</button><button id="nx">›</button><button id="gr" class="gear" title="Оформление и вид">⚙</button></div><div class="gh" id="gh"></div></div>
<div id="grid"></div><button class="fab" id="add">+ Новая запись</button></div>
<dialog id="dlg"><form method="dialog" id="fm" onsubmit="return false">
<div class="row"><label>Дата<input type="date" id="fd" required></label><label style="max-width:140px">Начало<select id="ft" required></select></label></div>
<label>Пациент<input id="fn" required autocomplete="off"></label>
<div style="font-size:12px;font-weight:600;color:#3f4a52;margin-bottom:4px">Длительность, мин (можно вписать вручную)</div><div style="display:flex;gap:8px;margin-bottom:8px"><button type="button" id="dm" class="st">−10</button><input id="fu" type="number" inputmode="numeric" min="5" max="480" step="5" style="flex:1;min-width:0;text-align:center"><button type="button" id="dp" class="st">+10</button></div><div class="ch" id="fc"></div>
<label>Телефон<input id="fp" type="tel"></label><label>Что планируется<input id="fo"></label>
<label>Статус<select id="fs"><option value="plan">Запись</option><option value="came">Пришёл</option><option value="missed">Не пришёл</option><option value="cancelled">Отменён</option></select></label>
<div class="acts"><button type="button" id="cx">Отмена</button><button type="button" class="del" id="dl">Удалить</button><button type="button" class="ok" id="sv">Сохранить</button></div></form></dialog>
<dialog id="sdlg"><div class="cg">Оформление</div><div class="sw" id="sw"></div><div class="cg">Вид</div><div class="ch" id="vw"><button type="button" data-v="auto">Авто</button><button type="button" data-v="phone">Телефон</button><button type="button" data-v="pc">ПК</button></div><div class="acts"><button type="button" class="ok" id="sx">Готово</button></div></dialog>
<dialog id="idlg" class="ins"><h3 id="it"></h3><ol id="il"></ol><div class="acts"><button type="button" class="ok" id="ix">Понятно</button></div></dialog>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,collection,query,where,onSnapshot,doc,setDoc,deleteDoc}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const CFG={apiKey:"AIzaSyBzs-bDLFiQ0F08jMuEbpvjmCiVZZILsbY",authDomain:"kabinet-f4595.firebaseapp.com",projectId:"kabinet-f4595",appId:"1:1039574152732:web:76afea81f78c412498d1d9"};
const OWNER="";
const $=s=>document.querySelector(s),app=initializeApp(CFG),auth=getAuth(app),db=getFirestore(app);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const p2=n=>String(n).padStart(2,'0'),hm=m=>p2(Math.floor(m/60))+':'+p2(m%60),tm=t=>{const m=/^(\d{1,2}):(\d{2})/.exec(t||'');return m?+m[1]*60+ +m[2]:null};
const DOW=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'],RH=36;
const mq=matchMedia('(min-width:900px)');
const L={bg:'#f4f7f8',cd:'#fff',tx:'#14212b',mu:'#4f5b64',ln:'#c3ccd2',l2:'#00000080',l3:'#00000066',l4:'#00000073',l5:'#000',l6:'#000000b3',tdb:'#eef7f8',ac:'#0f6b73',on:'#fff',mu2:'#3f4a52',tx2:'#2f3d47',dg:'#b42318'};
const PAL=[['#d8eef0','#9ccfd4'],['#fde9d3','#efc08a'],['#e6e3f7','#b9b2e6'],['#e3f2d9','#b3d89a'],['#fbe0e6','#eeaabb'],['#fff3c4','#e6cf73'],['#dbe8fb','#9dbbe8'],['#ece0d6','#cfb49c']];
const TH={teal:{n:'Бирюзовая',v:{}},blue:{n:'Синяя',v:{bg:'#f3f6fc',tdb:'#eaf0fd',ac:'#2f5fd0',ln:'#c5cde0'}},rose:{n:'Розовая',v:{bg:'#fbf4f7',tdb:'#fcebf1',ac:'#b83b6a',ln:'#e0c9d2'}},green:{n:'Зелёная',v:{bg:'#f3f8f4',tdb:'#e8f4ea',ac:'#2e7d4f',ln:'#c3d4c8'}},graph:{n:'Серая',v:{bg:'#f1f1f1',tdb:'#e9e9e9',ac:'#2f3a44',tx:'#111',ln:'#b5b5b5'}},dark:{n:'Тёмная',v:{bg:'#10181d',cd:'#172229',tx:'#e8eef1',mu:'#9fb0ba',ln:'#ffffff66',l2:'#ffffff80',l3:'#ffffff66',l4:'#ffffff73',l5:'#fff',l6:'#ffffffb3',tdb:'#14303a',ac:'#2bb3bf',on:'#04161a',mu2:'#b5c3cb',tx2:'#c7d3d9',dg:'#ff7b72'},col:[['#1f4a50','#2f7a82'],['#5a3d1d','#a8733a'],['#3d3868','#6f67b8'],['#2f4d25','#5f9448'],['#5a2a39','#a8506a'],['#5a4d17','#a8923a'],['#1f3d66','#4a7ac0'],['#4a3a2e','#8a6e55']],cx:['#2a3139','#4a5560']}};
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}};
let thm=TH[ls('sch-th')]?ls('sch-th'):(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'teal'),vmode=['auto','phone','pc'].includes(ls('sch-vw'))?ls('sch-vw'):'auto';
const wide=()=>vmode==='pc'||(vmode==='auto'&&mq.matches);
function applyUi(){const t=TH[thm],v={...L,...t.v},r=document.body.style;for(const k in v)r.setProperty('--'+k,v[k]);document.documentElement.style.background=v.bg;document.documentElement.style.colorScheme=thm==='dark'?'dark':'light';document.querySelector('meta[name=theme-color]').content=v.ac;
  document.body.classList.toggle('pc',vmode==='pc');document.querySelector('meta[name=viewport]').content=vmode==='pc'?'width=1100':'width=device-width,initial-scale=1,viewport-fit=cover'}

let bset=new Set(),day=iso(new Date()),unsub=null,items=[],cur=null,dur=30,cols=[],first=true;
const D=s=>new Date(s+'T12:00:00');
function setCols(){if(wide()){const d=D(day),w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);cols=[...Array(7)].map((_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return iso(x)})}else cols=[day]}
const shift=n=>{const d=D(day);d.setDate(d.getDate()+n*(wide()?7:1));day=iso(d);watch()};
function lanes(l){let cl=[],ce=0;const fl=()=>{const ln=[];cl.forEach(a=>{let i=ln.findIndex(e=>e<=a.s);if(i<0){i=ln.length;ln.push(0)}ln[i]=a.e;a.l=i});cl.forEach(a=>a.n=ln.length)};l.forEach(a=>{if(cl.length&&a.s>=ce){fl();cl=[];ce=0}cl.push(a);ce=Math.max(ce,a.e)});fl()}
function draw(){
  const td=iso(new Date()),n=cols.length;
  $('#ttl').textContent=n>1?D(cols[0]).toLocaleDateString('ru-RU',{day:'numeric',month:'long'})+' — '+D(cols[6]).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'}):D(day).toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
  $('#dt').value=day;
  const tpl='52px repeat('+n+',1fr)';$('#gh').style.gridTemplateColumns=tpl;$('#grid').style.gridTemplateColumns=tpl;
  const by={};cols.forEach(c=>by[c]=[]);
  items.forEach(x=>{const s=tm(x.time);if(s!==null&&by[x.date])by[x.date].push({x,s,e:s+Math.max(5,x.dur||30)})});
  let lo=480,hi=1200;Object.values(by).flat().forEach(a=>{lo=Math.min(lo,Math.floor(a.s/60)*60);hi=Math.max(hi,Math.ceil(a.e/60)*60)});
  const rows=(hi-lo)/10;bset=new Set();Object.values(by).flat().forEach(a=>{bset.add(a.s);bset.add(a.e)});const sp=m=>[m,...[...bset].filter(b=>b>m&&b<m+10).sort((x,y)=>x-y)];
  $('#gh').innerHTML='<div style="border:0"></div>'+cols.map(c=>`<div class="${c===td?'td':''}">${DOW[D(c).getDay()]}<b>${+c.slice(8)}</b><small>${by[c].length?by[c].length+' зап.':'—'}</small></div>`).join('');
  let h='<div class="tc">'+[...Array(rows)].map((_,i)=>{const m=lo+i*10,pt=sp(m);return pt.map((q,k)=>{const len=(k+1<pt.length?pt[k+1]:m+10)-q;return`<div class="${q%60?'':'h'}${len<10?' sb':''}" style="height:${len/10*RH}px">${hm(q)}</div>`}).join('')}).join('')+'</div>';
  cols.forEach(c=>{const l=by[c].sort((a,b)=>a.s-b.s);lanes(l);
    h+=`<div class="day ${c===td?'td':''}" data-d="${c}" style="height:${rows*RH}px">`+[...bset].filter(b=>b%10&&b>lo&&b<hi).map(b=>`<div class="sl" style="top:${(b-lo)/10*RH}px"></div>`).join('')+l.map((a,i)=>{const T=TH[thm],CO=T.col||PAL,k=a.x.status==='cancelled'?(T.cx||['#eceff1','#cfd6db']):CO[i%CO.length],w=100/a.n,mk=a.x.status==='came'?'✓ ':a.x.status==='missed'?'✕ ':'';
      return`<div class="ap" data-id="${esc(a.x.id)}" style="top:${(a.s-lo)/10*RH}px;height:${Math.max(RH/2-2,(a.e-a.s)/10*RH-2)}px;left:calc(${a.l*w}% + 1px);width:calc(${w}% - 3px);background:${k[0]};border-color:${k[1]};${a.x.status==='cancelled'?'opacity:.7;':''}"><b>${mk}${esc(a.x.name)}</b><span>${esc(a.x.time)} · ${a.x.dur||30} мин${a.x.note?' · '+esc(a.x.note):''}</span></div>`}).join('')+'</div>'});
  $('#grid').dataset.lo=lo;$('#grid').innerHTML=h;
  if(first&&items.length+1){first=false;const hr=Math.max(lo,Math.min(new Date().getHours()*60-60,hi-120));$('#grid').scrollIntoView();window.scrollTo(0,$('#grid').offsetTop+(hr-lo)/10*RH-120)}
}
function watch(){setCols();unsub&&unsub();unsub=onSnapshot(query(collection(db,'appts'),where('date','>=',cols[0]),where('date','<=',cols[cols.length-1])),s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));draw()},e=>{$('#grid').innerHTML='<div style="padding:20px">Ошибка доступа: '+esc(e.message)+'</div>'});draw()}
const TS=[];for(let m=300;m<=1380;m+=5)TS.push(hm(m));
function setT(v){let l=[...TS,...[...bset].filter(b=>b%10&&b>=300&&b<=1380).map(hm)];if(v)l.push(v);l=[...new Set(l)].sort();$('#ft').innerHTML='<option value="">— выберите —</option>'+l.map(t=>`<option>${t}</option>`).join('');$('#ft').value=v||''}
const getD=()=>Math.max(5,Math.min(480,Math.round(+$('#fu').value||30)));
function chips(){const c=+$('#fu').value;$('#fc').innerHTML=[15,30,45,60,90,120].map(m=>`<button type="button" data-m="${m}" class="${m===c?'on':''}">${m}</button>`).join('')}
function openF(x,date,time){cur=x||null;$('#fu').value=x&&x.dur||30;$('#fd').value=x?x.date:(date||day);setT(x?x.time:(time||''));$('#fn').value=x?x.name:'';$('#fp').value=x?x.phone:'';$('#fo').value=x?x.note:'';$('#fs').value=x?x.status:'plan';$('#dl').hidden=!x;chips();$('#dlg').showModal()}
$('#fc').onclick=e=>{const m=e.target.dataset.m;if(m){$('#fu').value=m;chips()}};$('#dm').onclick=()=>{$('#fu').value=Math.max(5,getD()-10);chips()};$('#dp').onclick=()=>{$('#fu').value=Math.min(480,getD()+10);chips()};$('#fu').oninput=chips;
$('#grid').onclick=e=>{const a=e.target.closest('.ap');if(a){openF(items.find(x=>x.id===a.dataset.id));return}
  const d=e.target.closest('.day');if(d){const y=e.clientY-d.getBoundingClientRect().top,lo=+$('#grid').dataset.lo,mm=lo+y/RH*10,r=lo+Math.floor(y/RH)*10,m=Math.max(...[r,...[...bset].filter(b=>b>r&&b<r+10)].filter(q=>q<=mm));openF(null,d.dataset.d,hm(m))}};
$('#add').onclick=()=>openF();$('#cx').onclick=()=>$('#dlg').close();
$('#sv').onclick=async()=>{if(!$('#fd').value||!$('#ft').value||!$('#fn').value.trim()){alert('Заполните дату, время и пациента');return}
  const id=cur?cur.id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  try{await setDoc(doc(db,'appts',id),{date:$('#fd').value,time:$('#ft').value,name:$('#fn').value.trim(),phone:$('#fp').value.trim(),note:$('#fo').value.trim(),status:$('#fs').value,dur:getD()});$('#dlg').close();if(!cols.includes($('#fd').value)){day=$('#fd').value;watch()}}catch(e){alert('Не сохранилось: '+e.message)}};
$('#dl').onclick=async()=>{if(cur&&confirm('Удалить запись?')){try{await deleteDoc(doc(db,'appts',cur.id));$('#dlg').close()}catch(e){alert(e.message)}}};
$('#pv').onclick=()=>shift(-1);$('#nx').onclick=()=>shift(1);$('#td').onclick=()=>{day=iso(new Date());watch()};$('#dt').onchange=e=>{if(e.target.value){day=e.target.value;watch()}};
mq.onchange=()=>{if(!$('#app').hidden)watch()};
function sUi(){$('#sw').innerHTML=Object.entries(TH).map(([k,t])=>`<button type="button" data-t="${k}" class="${k===thm?'on':''}" style="background:linear-gradient(90deg,${t.v.ac||L.ac} 0 20%,${t.v.bg||L.bg} 20%);color:${t.v.tx||L.tx};border-color:${t.v.ln||L.ln}">${t.n}</button>`).join('');$('#vw').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===vmode))}
$('#gr').onclick=()=>{sUi();$('#sdlg').showModal()};$('#sx').onclick=()=>$('#sdlg').close();
let dp=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e});
if(matchMedia('(display-mode: standalone)').matches||navigator.standalone)document.querySelector('.pw').hidden=true;
const inst=(t,l)=>{$('#it').textContent=t;$('#il').innerHTML=l.map(x=>'<li>'+x+'</li>').join('');$('#idlg').showModal()};
$('#ia').onclick=async()=>{if(dp){dp.prompt();try{await dp.userChoice}catch(e){}dp=null}else inst('Android: добавить на главный экран',['Откройте эту страницу в Chrome','Нажмите ⋮ (меню) справа вверху','Выберите «Установить приложение» или «Добавить на главный экран»','Подтвердите — значок «Расписание» появится на экране'])};
$('#ii').onclick=()=>inst('iPhone: добавить на экран «Домой»',['Откройте эту страницу в Safari (не в Chrome)','Нажмите кнопку «Поделиться» ⬆︎ внизу экрана','Прокрутите и выберите «На экран “Домой”»','Нажмите «Добавить» — значок «Расписание» появится на экране']);
$('#ix').onclick=()=>$('#idlg').close();
$('#sw').onclick=e=>{const t=e.target.dataset.t;if(t){thm=t;ls('sch-th',t);applyUi();sUi();draw()}};
$('#vw').onclick=e=>{const v=e.target.dataset.v;if(v){vmode=v;ls('sch-vw',v);applyUi();sUi();if(!$('#app').hidden)watch()}};
applyUi();
$('#in').onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>$('#lmsg').textContent='Не удалось войти: '+e.message);
onAuthStateChanged(auth,u=>{const ok=u&&(!OWNER||u.email.toLowerCase()===OWNER.toLowerCase());$('#app').hidden=!ok;$('#login').hidden=!!ok;if(u&&!ok)$('#lmsg').textContent='Этот аккаунт не имеет доступа';if(ok)watch();else unsub&&unsub()});
</script></body></html>
